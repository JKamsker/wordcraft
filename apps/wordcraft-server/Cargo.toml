[package]
name = "wordcraft-server"
description = "Serves WordCraft for the web and stores documents (directory, S3, Azure Blob, GCS, FTP, SMB)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "wordcraft-server"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form", "multipart", "json"] }
chrono = { workspace = true, features = ["serde", "clock"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = { workspace = true }
percent-encoding = "2"
# S3, Azure Blob and GCS. The cloud features pull in aws-lc-rs, so take the `*-base` features and pick
# the `ring` crypto provider; reqwest and rustls below are configured the same way.
object_store = { version = "0.14", default-features = false, features = ["aws-base", "azure-base", "gcp-base", "ring", "reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# System root certificates for FTPS.
rustls-native-certs = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
# SMB2/3 shares (pure Rust, NTLM through sspi with ring; no Kerberos, which would pull reqwest).
smb = { version = "0.12", default-features = false, features = ["async", "sign", "encrypt"] }
# FTP/FTPS (explicit TLS through rustls with the ring provider; never aws-lc or native-tls).
suppaftp = { version = "12.2", default-features = false, features = ["tokio", "tokio-rustls-ring"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "io-util", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
url = "2"

[dev-dependencies]
tempfile = "3"
# An in-process FTP server for the FTP backend's round-trip test.
libunftp = { version = "0.24", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4"
